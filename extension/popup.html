<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>CrockBot</title>
    <style>
      body { width: 320px; font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 16px; color: #111; }
      h1 { font-size: 14px; margin: 0 0 8px; }
      p { font-size: 12px; color: #555; margin: 0 0 12px; line-height: 1.4; }
      input { width: 100%; box-sizing: border-box; padding: 8px; font-size: 12px; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 8px; }
      button { width: 100%; padding: 9px; background: #4f46e5; color: white; border: 0; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px; }
      button:disabled { opacity: .5; cursor: not-allowed; }
      .status { font-size: 12px; margin-top: 10px; padding: 8px; border-radius: 6px; }
      .ok { background: #ecfdf5; color: #065f46; }
      .err { background: #fef2f2; color: #991b1b; }
      .warn { background: #fefce8; color: #854d0e; font-size: 11px; line-height: 1.4; margin-top: 12px; padding: 8px; border-radius: 6px; }
    </style>
  </head>
  <body>
    <h1>Connect LinkedIn</h1>
    <p>Paste your CrockBot workspace URL, then click Capture. Your session cookie stays in your workspace.</p>
    <input id="endpoint" placeholder="https://your-app.lovable.app" />
    <button id="capture">Capture & link session</button>
    <div id="status"></div>
    <div class="warn">LinkedIn restricts automation. Use small daily limits. You may be temporarily restricted. Approval-gated only.</div>
    <script src="popup.js"></script>
  </body>
</html>
